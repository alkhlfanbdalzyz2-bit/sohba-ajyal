<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0b1430"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png?v=2"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="لوحة التحكم"><title>لوحة التحكم · صحبة أجيال</title>
<style>
:root{--bg:#0b1430;--c1:#13204a;--c2:#1a2a5c;--ln:#ffffff1f;--t:#fff;--m:#aab3cc;--or:#f7941d;--g:linear-gradient(135deg,#f7941d,#f26a21);--ok:#3ecf8e;--bad:#e5484d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"SF Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--t);line-height:1.7;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:rgba(11,20,48,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}.hd h1{margin:0;font-size:18px}.hd small{color:var(--m);font-size:12px}
.rf{border:1px solid var(--ln);background:var(--c1);color:var(--t);border-radius:12px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
nav{display:flex;gap:4px;overflow-x:auto;margin:10px -14px 0;padding:0 14px 10px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:transparent;color:var(--m);font:inherit;font-size:14px;font-weight:700;padding:8px 12px;border-radius:12px;cursor:pointer;position:relative}
nav button.on{background:var(--c1);color:var(--t)}nav button i{font-style:normal;margin-inline-start:4px;background:var(--or);color:#fff;border-radius:99px;font-size:11px;padding:0 6px}
main{padding:14px;max-width:760px;margin:0 auto;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.sec{display:none}.sec.on{display:block}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kp div{padding:14px;border-radius:18px;background:var(--c1);border:1px solid var(--ln)}
.kp b{display:block;font-size:28px;color:#f7b267;line-height:1.2}.kp small{color:var(--m);font-size:13px}
.card{padding:14px;border-radius:18px;background:var(--c1);border:1px solid var(--ln);margin-top:12px}
.card h3{margin:0 0 8px;font-size:15px}.mut{color:var(--m);font-size:13px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.bar span{width:120px;flex:none;color:var(--m)}.bar i{display:block;height:10px;border-radius:9px;background:var(--g);min-width:2px}.bar em{font-style:normal;font-weight:800;min-width:24px}
.chart{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:6px;direction:ltr}.chart div{flex:1;background:var(--g);border-radius:4px 4px 0 0;min-height:2px;position:relative}.chart div.z{background:#ffffff14}
.chart div b{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--m);font-weight:600}
.axis{display:flex;justify-content:space-between;color:var(--m);font-size:11px;direction:ltr;margin-top:4px}
.sg{padding:14px;border-radius:18px;background:var(--c1);border:1px solid #f7941d55;margin-top:12px}.sg.ok{border-color:#3ecf8e77}.sg.tr{background:#ffffff08;border-color:var(--ln)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.tg{font-size:12px;font-weight:700;padding:1px 10px;border-radius:99px;background:#f7941d22;color:#f7b267}.tg.ok{background:#3ecf8e22;color:#5fe0a5}.tg.gr{background:#ffffff14;color:var(--m)}
.msg{white-space:pre-wrap}.sg small{display:block;color:var(--m);font-size:12px}
textarea,input,select{display:block;width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);color:var(--t);font:inherit;font-size:16px}textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--or)}label{display:block;font-size:13px;color:var(--m);margin:10px 0 4px}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--g);color:#fff;font:inherit;font-weight:800;cursor:pointer}.btn.big{display:block;width:100%;padding:13px;font-size:16px;margin-top:12px}
.btn.gh{background:transparent;border:1px solid var(--ln);color:var(--t)}.btn.dl{background:transparent;border:1px solid #ff6b6b66;color:#ff8a8a}.btn.sure{background:var(--bad);color:#fff;border-color:var(--bad)}.btn[disabled]{opacity:.5}
.st{font-size:13px;color:var(--m)}.tpl{display:flex;gap:6px;flex-wrap:wrap}.tpl button{border:1px solid var(--ln);background:var(--bg);color:var(--t);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.pv{margin-top:12px;padding:12px 14px;border-radius:16px;background:#fff;color:#111;display:flex;gap:10px;align-items:flex-start}.pv img{width:38px;height:38px;border-radius:9px}.pv b{display:block;font-size:14px}.pv span{font-size:13.5px;color:#333}
.seg{display:flex;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:3px;margin-top:10px}.seg button{flex:1;border:0;background:none;color:var(--m);font:inherit;font-weight:700;padding:7px;border-radius:9px;cursor:pointer}.seg button.on{background:var(--c2);color:var(--t)}
.lg{padding:10px 12px;border-radius:12px;background:var(--bg);margin-top:8px;font-size:14px}.lg small{display:block;color:var(--m);font-size:12px}
details summary{cursor:pointer;color:var(--m);margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);opacity:0;pointer-events:none;background:#fff;color:#111;font-weight:700;padding:10px 18px;border-radius:99px;transition:transform .3s;z-index:9;box-shadow:0 10px 30px #0006}.toast.on{transform:translateX(-50%);opacity:1}
.empty{text-align:center;color:var(--m);padding:20px}
.ld{text-align:center;color:var(--m);padding:40px}
body.lo header nav,body.lo #rf,body.lo #lo{display:none}.lg-in{max-width:340px;margin:12vh auto 0;text-align:center}.lg-in img{width:88px;height:88px;border-radius:50%;background:#fff;padding:8px}.lg-in h2{margin:12px 0 0;font-size:20px}
.out{border:0;background:none;color:var(--m);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}.tpls{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}.chip{border:1px solid var(--ln);background:var(--c2);color:var(--t);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
</style></head><body>
<header><div class="hd"><div><h1>🎛️ لوحة التحكم</h1><small>صحبة أجيال · كل شي هني بدون نشر · <button class="out" id="lo">خروج</button></small></div><button class="rf" id="rf">↻ تحديث</button></div>

<script>
var D=null,SEC='home';try{SEC=sessionStorage.getItem('sec')||'home'}catch(_){}
var $=function(s){return document.querySelector(s)},esc=function(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

var TPL=[['🔥 برنامجنا اليوم','🔥 برنامجنا اليوم','لا تنسون برنامجنا اليوم، الحضور الساعة ٤:٤٠ م بالمركز 💙🧡','./'],['🕌 يوم الجمعة','🕌 يوم الجمعة','لا تنسون سنن يوم الجمعة: سورة الكهف والإكثار من الصلاة على النبي ﷺ 🤍','./#/me'],['🤍 ساعة الاستجابة','🤍 ساعة الاستجابة','قال ﷺ: "فالتمسوها آخر ساعة بعد العصر". اغتنموها بالدعاء، ولا تنسونا من دعائكم ❤️','./'],['🌙 الوتر','🌙 الوتر والثلث الأخير','لا تنام قبل ما توتر 🤍 والحين الثلث الأخير من الليل، اغتنمه بالدعاء','./#/me'],['📸 صور جديدة','📸 جديد بكورس على خطاه ﷺ','تم إضافة صور وفيديو جديدة','./#/khutah/photos'],['📊 نقاط','📊 تحديث نقاط الحلقة','تم تحديث لوحة نقاط حلقة القرآن الكريم، شوف ترتيبك','./#/khutah/halaqat']];
var REM={fajr:'🌅 سنة الفجر',duha:'🌤️ صلاة الضحى',sabah:'☀️ أذكار الصباح',masa:'🌙 أذكار المساء',nawm:'🛏️ أذكار النوم',kahf:'📖 سورة الكهف',istijaba:'🤍 ساعة الاستجابة',siyam:'🌙 صيام الاثنين والخميس',witr:'🌙 الوتر والثلث الأخير'};
var PG={home:'الرئيسية',me:'صفحتي',adhkar:'الأذكار',khutah:'الكورس',halaqat:'نقاط الحلقة',points:'نقاط الكورس',challenges:'التحديات',photos:'صور الكورس',memories:'الذكريات',album:'الألبومات',videos:'الفيديوهات',favs:'المفضلة',awards:'التتويج'};
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2400)}
var API='https://ajyalcl.netlify.app/.netlify/functions/admin',KEY='';try{KEY=localStorage.getItem('k')||''}catch(_){}
function api(o){return fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Key':KEY},body:JSON.stringify(o)}).then(function(r){return r.json().then(function(d){if(!r.ok)throw d;return d})})}
function load(){if(!KEY){login();return Promise.resolve()}return fetch(API,{cache:'no-store',headers:{'X-Key':KEY}}).then(function(r){if(r.status===401){KEY='';try{localStorage.removeItem('k')}catch(_){}login('الرمز غلط');throw 1}if(!r.ok)throw 0;return r.json()}).then(function(d){D=d;render()}).catch(function(x){if(x!==1)$('#m').innerHTML='<div class="ld">صار خطأ بالتحميل، اضغط تحديث</div>'})}
function login(err){document.body.classList.add('lo');$('#m').innerHTML='<form class="lg-in" id="lf"><img src="logo.webp" alt=""><h2>لوحة تحكم صحبة أجيال</h2><p class="mut">ادخل الرمز السري</p><input id="lk" type="password" autocomplete="current-password" placeholder="الرمز"><button class="btn big">دخول</button>'+(err?'<p style="color:#ff8a8a">'+err+'</p>':'')+'</form>';$('#lk').focus()}
document.addEventListener('submit',function(e){if(e.target.id!=='lf')return;e.preventDefault();KEY=$('#lk').value.trim();try{localStorage.setItem('k',KEY)}catch(_){}document.body.classList.remove('lo');$('#m').innerHTML='<div class="ld">...</div>';load()});
function bars(obj,labels){var k=Object.keys(obj).sort(function(a,b){return obj[b]-obj[a]}),mx=Math.max.apply(null,k.map(function(x){return obj[x]}).concat([1]));
 return k.length?k.map(function(x){return'<div class="bar"><span>'+esc(labels&&labels[x]||x)+'</span><i style="width:'+Math.max(2,obj[x]/mx*60)+'%"></i><em>'+ar(obj[x])+'</em></div>'}).join(''):'<div class="empty">للحين ما فيه بيانات</div>'}
function vHome(){var s=D.stats,nu=D.items.filter(function(i){return!i.r}).length;
 return '<div class="kp"><div><b>'+ar(s.today)+'</b><small>زائر اليوم</small></div><div><b>'+ar(s.week)+'</b><small>زوار هالأسبوع</small></div><div><b>'+ar(s.all)+'</b><small>من البداية</small></div><div><b>'+ar(s.subs)+'</b><small>مفعّل الإشعارات</small></div></div>'+
 '<div class="card"><div class="row"><h3 class="sp">📮 الاقتراحات</h3><button class="btn gh" data-go="sug">فتح</button></div><div class="mut">'+(nu?'عندك <b style="color:#f7b267">'+ar(nu)+'</b> اقتراح بانتظار ردك':'كل الاقتراحات مردود عليها ✅')+' · المجموع '+ar(D.items.length)+'</div></div>'+
 (D.cfg.banner?'<div class="card"><h3>📢 شريط التنبيه شغّال</h3><div class="mut">'+esc(D.cfg.banner.t)+'</div></div>':'')+
 (D.sched.length?'<div class="card"><h3>⏰ إشعارات مجدولة</h3>'+D.sched.map(function(x){return'<div class="mut">'+fmt(x.at)+' · '+esc(x.title)+'</div>'}).join('')+'</div>':'')+
 '<div class="card"><h3>🔔 التذكيرات اللي مفعّلينها الشباب</h3>'+bars(D.rem,REM)+'</div>'+
 '<div class="card"><h3>📬 آخر التذكيرات اللي انرسلت</h3>'+((D.remlog||[]).length?D.remlog.slice(0,8).map(function(x){return'<div class="mut">'+(REM[x.k]||x.k)+' · '+fmt(x.at)+' · وصل لـ '+ar(x.sent||0)+'</div>'}).join(''):'<div class="empty">بتطلع هني من أول تذكير ينرسل</div>')+'</div>'+
 '<div class="card"><h3>آخر ٧ أيام</h3>'+chart(D.daily.slice(-7),1)+'</div>'}
function chart(arr,lbl){var mx=Math.max.apply(null,arr.map(function(x){return x[1]}).concat([1]));
 return '<div class="chart">'+arr.map(function(x){return'<div class="'+(x[1]?'':'z')+'" style="height:'+Math.max(2,x[1]/mx*100)+'%">'+(lbl&&x[1]?'<b>'+x[1]+'</b>':'')+'</div>'}).join('')+'</div><div class="axis"><span>'+arr[0][0].slice(5)+'</span><span>'+arr[arr.length-1][0].slice(5)+'</span></div>'}
function vSug(){var f=SF||'new',L=D.items.filter(function(i){return f==='all'||(f==='new'?!i.r:!!i.r)});
 return '<div class="seg" id="sgf"><button data-f="new" class="'+(f==='new'?'on':'')+'">بانتظار الرد ('+ar(D.items.filter(function(i){return!i.r}).length)+')</button><button data-f="done" class="'+(f==='done'?'on':'')+'">تم الرد</button><button data-f="all" class="'+(f==='all'?'on':'')+'">الكل</button></div>'+
 (L.length?L.map(function(i){return'<div class="sg'+(i.r?' ok':'')+'" data-id="'+i.id+'"><div class="tags"><span class="tg'+(i.r?' ok">✅ تم الرد':'">بانتظار الرد')+'</span>'+(i.push?'<span class="tg ok">🔔 يوصله إشعار</span>':'')+(i.reach?'':'<span class="tg gr">ما يوصله الرد</span>')+(i.et?'<span class="tg gr">✏️ معدّل</span>':'')+'</div><div class="msg">'+esc(i.m)+'</div><small>'+fmt(i.t)+'</small>'+
  '<textarea placeholder="اكتب ردك هني…">'+esc(i.r||'')+'</textarea><div class="row" style="margin-top:8px"><button class="btn" data-a="reply">'+(i.r?'تعديل الرد':'أرسل الرد')+'</button><span class="st sp"></span><button class="btn dl" data-a="del">🗑️</button></div></div>'}).join(''):'<div class="empty">ما فيه شي هني 👌</div>')+
 (D.trash.length?'<details><summary>🗑️ المحذوفات ('+ar(D.trash.length)+')</summary>'+D.trash.map(function(i){return'<div class="sg tr" data-id="'+i.id+'"><div class="tags"><span class="tg gr">'+(i.del&&i.del.by==='user'?'حذفه صاحبه':'حذفته أنت')+(i.del?' · '+fmt(i.del.at):'')+'</span></div><div class="msg">'+esc(i.m)+'</div>'+(i.r?'<small>ردك: '+esc(i.r)+'</small>':'')+(i.h.length?'<small>النسخ القديمة: '+i.h.map(function(x){return esc(x.m)}).join(' · ')+'</small>':'')+'<div class="row" style="margin-top:8px"><button class="btn gh" data-a="restore">↩️ استرجاع</button><span class="st"></span></div></div>'}).join('')+'</details>':'')}
var SF='new',PM='now';
function vPush(){return '<div class="card"><h3>قوالب جاهزة</h3><div class="tpl">'+TPL.map(function(t,i){return'<button data-tpl="'+i+'">'+t[0]+'</button>'}).join('')+'</div></div>'+
 '<div class="card"><label>العنوان</label><input id="pt" maxlength="80" placeholder="مثال: 🔥 برنامجنا اليوم"><label>النص</label><textarea id="pb" maxlength="240" placeholder="مثال: الحضور الساعة ٤:٤٠ م بالمركز"></textarea>'+
 '<label>لما يضغطون الإشعار يفتح</label><select id="pu">'+LINKS.map(function(l){return'<option value="'+l[0]+'">'+l[1]+'</option>'}).join('')+'</select>'+
 '<div class="seg" id="pm"><button data-m="now" class="'+(PM==='now'?'on':'')+'">أرسل الحين</button><button data-m="later" class="'+(PM==='later'?'on':'')+'">⏰ جدولة</button></div>'+
 '<div id="plater" '+(PM==='later'?'':'hidden')+'><label>وقت الإرسال (بتوقيت الكويت)</label><input type="datetime-local" id="pat"></div>'+
 '<div class="pv"><img src="logo.webp" alt=""><div><b id="pvt">العنوان</b><span id="pvb">النص</span></div></div>'+
 '<button class="btn big" id="psend">'+(PM==='now'?'🔔 أرسل للكل ('+ar(D.stats.subs)+' جهاز)':'⏰ جدول الإشعار')+'</button><div class="st" id="pst" style="text-align:center;margin-top:8px"></div></div>'+
 (D.sched.length?'<div class="card"><h3>⏰ المجدولة</h3>'+D.sched.map(function(x){return'<div class="lg" data-sid="'+x.id+'"><div class="row"><div class="sp"><b>'+esc(x.title)+'</b> '+esc(x.body)+'<small>يطلع '+fmt(x.at)+'</small></div><button class="btn dl" data-a="unsched">إلغاء</button></div></div>'}).join('')+'</div>':'')+
 '<div class="card"><h3>آخر الإشعارات</h3>'+(D.log.length?D.log.map(function(x){var c=D.clicks[x.tag]||0;return'<div class="lg"><b>'+esc(x.title)+'</b> '+esc(x.body)+'<small>'+fmt(x.at)+' · وصل لـ '+ar(x.sent||0)+' · ضغطوه '+ar(c)+(x.sent?' ('+ar(Math.round(c/x.sent*100))+'٪)':'')+(x.sched?' · مجدول':'')+(x.dep?' · مع النشر':'')+'</small></div>'}).join(''):'<div class="empty">للحين ما فيه</div>')+'</div>'}
function vStats(){var hrs={};D.hours.forEach(function(n,h){if(n)hrs[(h%12||12)+(h<12?' ص':' م')]=n});
 var best=D.hours.indexOf(Math.max.apply(null,D.hours));
 return '<div class="card"><h3>الزوار آخر ٣٠ يوم</h3>'+chart(D.daily)+'</div>'+
 '<div class="card"><h3>أكثر الأوقات دخولاً (آخر ٣٠ يوم)</h3>'+(Math.max.apply(null,D.hours)?'<div class="mut" style="margin-bottom:6px">أحسن وقت ترسل فيه: <b style="color:#f7b267">'+ar(best%12||12)+(best<12?' الصبح':(best<17?' الظهر/العصر':' بالليل'))+'</b></div><div class="chart" style="height:90px">'+D.hours.map(function(n){var mx=Math.max.apply(null,D.hours)||1;return'<div class="'+(n?'':'z')+'" style="height:'+Math.max(2,n/mx*100)+'%"></div>'}).join('')+'</div><div class="axis"><span>١٢ ص</span><span>٦ ص</span><span>١٢ م</span><span>٦ م</span><span>١١ م</span></div>':'<div class="empty">للحين ما فيه بيانات</div>')+'</div>'+

function render(){var n=$('#nav').querySelectorAll('button'),nu=D.items.filter(function(i){return!i.r}).length;

 if(t.closest('#psend')){var bb=$('#psend'),o2={a:PM==='now'?'send':'sched',title:$('#pt').value,body:$('#pb').value,url:$('#pu').value};

  bb.disabled=true;$('#pst').textContent='...';
  api(o2).then(function(d){toast(PM==='now'?'✅ انرسل لـ '+ar(d.sent)+' جهاز':'⏰ انجدول ✅');return load()}).catch(function(err){bb.disabled=false;bb.classList.remove('sure');$('#pst').textContent=err&&err.err==='time'?'الوقت لازم يكون بالمستقبل':'صار خطأ، جرّب مرة ثانية'});return}
