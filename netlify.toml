[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/m/*"
  to = "/.netlify/functions/m?p=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/_src/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/notify.json"
  [headers.values]
    Cache-Control = "no-store"

[functions."reminders"]
  schedule = "*/10 * * * *"
