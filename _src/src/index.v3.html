  if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  var m = document.getElementById('tc'); if (m) m.content = t === 'light' ? '#ffffff' : '#060d20';
})();

<style>
/* ================= الهوية: كحلي + برتقالي ================= */
:root{
  --or:#f7931e; --am:#fbb03b; --or2:#ff7a1a; --sky:#2a9df4; --blue:#1f5fd1; --indigo:#2e3192;
  --disp:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --cal:"Aref Ruqaa","Alexandria",serif;
  --body:"IBM Plex Sans Arabic","Alexandria",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:24px; --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="dark"]{
  --bg:#060d20; --bg2:#0a1530; --bg3:#0f1d40;
  --card:rgba(16,30,64,.62); --card2:rgba(22,40,84,.55); --solid:#0d1a3a;
  --ink:#f5f7fc; --t2:rgba(222,230,248,.74); --t3:rgba(222,230,248,.5);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --hdr:rgba(6,13,32,.72); --shadow:0 20px 60px rgba(0,0,0,.45);
  --glowO:rgba(247,147,30,.32); --glowB:rgba(42,120,244,.28);
  --disc:#ffffff; --chip:rgba(255,255,255,.06);
  --gridline:rgba(255,255,255,.035);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#ffffff; --bg2:#f5f7fc; --bg3:#eaf0fa;
  --card:#ffffff; --card2:#f7f9fd; --solid:#ffffff;
  --ink:#0b1735; --t2:#475576; --t3:#7b88a6;
  --line:rgba(11,23,53,.08); --line2:rgba(11,23,53,.14);
  --hdr:rgba(255,255,255,.8); --shadow:0 18px 50px rgba(14,31,77,.10);
  --glowO:rgba(247,147,30,.22); --glowB:rgba(42,120,244,.14);
  --disc:#ffffff; --chip:rgba(11,23,53,.04);
  --gridline:rgba(11,23,53,.04);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:84px}
html.noscroll,html.noscroll body{overflow:hidden}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.75;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background-color .4s,color .4s}
img,svg,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:var(--disp);line-height:1.3;text-wrap:balance}
p{text-wrap:pretty}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}

/* شريط التقدم */
.sprog{position:fixed;top:0;left:0;right:0;height:3px;z-index:120;transform-origin:right;transform:scaleX(0);background:linear-gradient(270deg,var(--am),var(--or),var(--sky));pointer-events:none}

/* ================= الهيدر ================= */
.hdr{position:sticky;top:0;z-index:100;padding-top:var(--safeT);background:var(--hdr);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);transition:background-color .4s}
.hdr .wrap{display:flex;align-items:center;gap:12px;height:66px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .lg{flex:none;width:44px;height:44px;border-radius:50%;background:var(--disc);padding:4px;box-shadow:0 0 0 2px var(--or),0 6px 18px var(--glowO)}
.brand .lg img{width:100%;height:100%;object-fit:contain}
.brand b{display:block;font-family:var(--disp);font-weight:800;font-size:16px;line-height:1.25;white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--t3);font-weight:500;white-space:nowrap}
.nav{display:none;margin-inline-start:auto;gap:4px}
.nav button{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--t2);transition:color .2s,background .2s}
.nav button:hover{color:var(--ink);background:var(--chip)}
.hbtns{display:flex;gap:8px;margin-inline-start:auto}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--chip);border:1px solid var(--line2);color:var(--ink);transition:transform .2s,background .2s}
.ib:active{transform:scale(.94)}
.ib svg{width:20px;height:20px}
.ib .sun{display:none} :root[data-theme="light"] .ib .sun{display:block} :root[data-theme="light"] .ib .moon{display:none}
@media (min-width:900px){ .nav{display:flex} .hbtns{margin-inline-start:12px} .menu-b{display:none} }

/* القائمة (جوال) */
#menu{position:fixed;inset:0;z-index:140;display:flex;align-items:flex-start;justify-content:center;padding:calc(76px + var(--safeT)) 16px 16px;background:rgba(3,7,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
#menu[hidden]{display:none} #menu.on{opacity:1}
#menu .mc{width:100%;max-width:420px;border-radius:26px;background:var(--solid);border:1px solid var(--line2);box-shadow:var(--shadow);padding:10px;transform:translateY(-10px) scale(.98);transition:transform .3s var(--ease)}
#menu.on .mc{transform:none}
#menu .mc button{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;font-family:var(--disp);font-weight:700;font-size:17px;text-align:start}
#menu .mc button:hover,#menu .mc button:active{background:var(--chip)}
#menu .mc button i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(247,147,30,.18),rgba(247,147,30,.06));color:var(--or);font-style:normal}
#menu .mc button i svg{width:19px;height:19px}

/* ================= الهيرو ================= */
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:min(88svh,720px);display:flex;align-items:flex-end;color:#fff;background:#060d20}
.hero .ph{position:absolute;inset:0;z-index:-3}
.hero .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 0%;transform:scale(1.06);animation:heroIn 2.4s var(--ease) forwards}
@keyframes heroIn{to{transform:scale(1)}}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(6,13,32,.35) 0%,rgba(6,13,32,0) 22%,rgba(6,13,32,.35) 48%,rgba(6,13,32,.92) 72%,#060d20 100%)}
.hero .slash{position:absolute;z-index:-1;inset-inline-start:-12%;bottom:34%;width:70%;height:6px;background:linear-gradient(90deg,transparent,var(--or));transform:rotate(-8deg);opacity:.9;box-shadow:0 0 24px rgba(247,147,30,.6)}
.hero .slash.s2{bottom:31.5%;height:2px;width:46%;opacity:.55;background:linear-gradient(90deg,transparent,#2a9df4)}
.hero .in{padding-bottom:30px}
.hero .lg{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;font-size:13.5px;opacity:0;animation:fup .8s .3s var(--ease) forwards}
.hero .lg i{width:30px;height:30px;border-radius:50%;background:#fff;padding:3px;display:block}
.hero .lg img{width:100%;height:100%;object-fit:contain}
.h-title{font-family:var(--cal);font-weight:700;font-size:clamp(58px,17vw,120px);line-height:1.15;margin-top:10px;text-shadow:0 8px 40px rgba(0,0,0,.45);opacity:0;animation:fup 1s .45s var(--ease) forwards}
.h-title .g{color:var(--or)}
.h-sub{font-family:var(--disp);font-weight:600;font-size:clamp(15px,4.2vw,20px);color:rgba(255,255,255,.85);margin-top:4px;opacity:0;animation:fup .9s .65s var(--ease) forwards}
.hero .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;opacity:0;animation:fup .9s .8s var(--ease) forwards}
.hero .tags span{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:10px;background:rgba(6,13,32,.55);border:1px solid rgba(255,255,255,.14);font-weight:600;font-size:13.5px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hero .tags svg{width:15px;height:15px;color:var(--or)}
.hero .go{display:flex;gap:10px;margin-top:20px;opacity:0;animation:fup .9s .95s var(--ease) forwards}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:52px;padding:0 22px;border-radius:14px;font-family:var(--disp);font-weight:700;font-size:15.5px;transition:transform .2s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:19px;height:19px}
.btn-p{color:#fff;background:var(--or);box-shadow:0 10px 26px rgba(247,147,30,.35)}
.btn-w{color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@keyframes fup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (min-width:760px){ .hero{min-height:min(86vh,760px)} .hero .in{padding-bottom:56px} .hero .ph img{object-position:50% 60%} }

/* ================= أقسام ================= */
.band{position:relative;padding:44px 0}
.sh{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-bottom:18px}
.sh .eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:800;font-size:13px;color:var(--or)}
.sh .eyebrow b{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--or);color:#fff;transform:skewX(-10deg)}
.sh .eyebrow::after{content:"";width:36px;height:2px;border-radius:2px;background:linear-gradient(270deg,var(--or),transparent)}

.sh h2{font-family:var(--cal);font-weight:700;font-size:clamp(34px,9vw,52px);line-height:1.25}
.sh p{color:var(--t2);max-width:560px;font-size:15.5px}
.alt{background:var(--bg2)}
.alt::before{content:"";position:absolute;inset-inline:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}

/* رسالتنا */
.mission{position:relative;border-radius:26px;padding:24px 20px;text-align:center;overflow:hidden;isolation:isolate;
  background:linear-gradient(135deg,#0b1a44 0%,#10265e 55%,#0a1736 100%);color:#fff;box-shadow:0 30px 80px rgba(8,20,55,.35)}
.mission::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 85% 0%,rgba(247,147,30,.45),transparent 45%),radial-gradient(circle at 0% 100%,rgba(42,157,244,.35),transparent 50%)}
.mission .q{font-family:var(--disp);font-size:120px;line-height:.6;color:var(--or);opacity:.9;height:46px}
.mission .lbl{display:inline-block;font-family:var(--disp);font-weight:700;font-size:14px;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);margin-bottom:14px}
.mission h2{font-family:var(--cal);font-size:clamp(30px,8.4vw,52px);line-height:1.5;font-weight:900;line-height:1.45}
.mission h2 em{font-style:normal;background:linear-gradient(135deg,var(--am),var(--or));-webkit-background-clip:text;background-clip:text;color:transparent}
.mission .motto{margin-top:16px;color:rgba(255,255,255,.75);font-size:15.5px;font-weight:600}
.mission svg.mark{position:absolute;inset-inline-end:-40px;bottom:-60px;width:260px;opacity:.08;z-index:-1}

/* من نحن */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pl{position:relative;border-radius:22px;padding:16px 10px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;transition:transform .3s var(--ease),border-color .3s}
.pl:hover{transform:translateY(-3px);border-color:rgba(247,147,30,.4)}
.pl .ic{flex:none;width:52px;height:52px;border-radius:17px;display:grid;place-items:center;color:#fff;box-shadow:0 12px 26px var(--c2)}
.pl .ic svg{width:26px;height:26px}
.pl h3{font-family:var(--cal);font-size:24px;font-weight:700}
.pl p{color:var(--t2);font-size:13px;line-height:1.55}
.pl .bgn{position:absolute;inset-inline-end:-10px;bottom:-26px;font-family:var(--disp);font-weight:900;font-size:110px;line-height:1;color:var(--ink);opacity:.04}
.pl.c1{--c2:rgba(247,147,30,.35)} .pl.c1 .ic{background:linear-gradient(135deg,var(--am),var(--or2))}
.pl.c2{--c2:rgba(42,157,244,.32)} .pl.c2 .ic{background:linear-gradient(135deg,#43b3ff,var(--blue))}
.pl.c3{--c2:rgba(46,49,146,.32)} .pl.c3 .ic{background:linear-gradient(135deg,#5866e8,var(--indigo))}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.fc{border-radius:var(--r);padding:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:center}
.fc b{display:block;font-family:var(--disp);font-weight:900;font-size:clamp(28px,8vw,40px);line-height:1.2;background:linear-gradient(135deg,var(--am),var(--or));-webkit-background-clip:text;background-clip:text;color:transparent}
.fc span{display:block;color:var(--t2);font-weight:600;font-size:14.5px}
.lead{max-width:720px;margin:0 auto 22px;text-align:center;font-size:17px;color:var(--t2)}
.lead b{color:var(--ink)}
@media (min-width:760px){ .pl{padding:24px 18px} .pl h3{font-size:21px} .pl p{font-size:14.5px} }

/* ================= كروت المربعات (اللي عجبتكم) ================= */
.qm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qc{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;min-height:130px;overflow:hidden;isolation:isolate;text-align:start;
  background:var(--card);border:1px solid var(--line2);box-shadow:var(--shadow);transition:transform .3s var(--ease),box-shadow .3s}
.qc:active{transform:scale(.98)}
.qc::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.95}
.qc.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;padding:20px}
.qc .qi{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line2)}
:root[data-theme="light"] .qc .qi{background:#fff}
.qc .qi svg{width:26px;height:26px}
.qc .qt{display:block;flex:1;min-width:0}
.qc .qt b{display:block;font-family:var(--disp);font-weight:800;font-size:clamp(19px,5.4vw,24px);line-height:1.35}
.qc .qt small{display:block;color:var(--t2);font-size:14.5px;margin-top:4px;line-height:1.55}
.qc .qa{position:absolute;top:18px;inset-inline-end:16px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--ink)}
:root[data-theme="light"] .qc .qa{background:rgba(11,23,53,.06)}
.qc.wide .qa{position:static}
.qc .qa svg{width:16px;height:16px}
.qc .shine{position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);transform:translateX(100%);animation:sheen 5s 2s ease-in-out infinite}
.t-gold::before{background:linear-gradient(105deg,rgba(201,154,60,.42),rgba(60,40,18,.25) 45%,transparent 75%)}
.t-gold{border-color:rgba(214,170,90,.55)} .t-gold .qi{color:#f2c46b}
.t-or::before{background:linear-gradient(150deg,rgba(247,147,30,.32),transparent 60%)}
.t-or{border-color:rgba(247,147,30,.35)} .t-or .qi{color:var(--am)}
.t-bl::before{background:linear-gradient(150deg,rgba(42,157,244,.30),transparent 60%)}
.t-bl{border-color:rgba(42,157,244,.35)} .t-bl .qi{color:#6cc4ff}
:root[data-theme="light"] .t-gold::before{background:linear-gradient(105deg,rgba(247,180,60,.28),rgba(255,236,200,.4) 45%,transparent 80%)}
:root[data-theme="light"] .t-gold .qi{color:#c88a12}
:root[data-theme="light"] .t-or::before{background:linear-gradient(150deg,rgba(247,147,30,.16),transparent 60%)}
:root[data-theme="light"] .t-or .qi{color:var(--or)}
:root[data-theme="light"] .t-bl::before{background:linear-gradient(150deg,rgba(42,157,244,.14),transparent 60%)}
:root[data-theme="light"] .t-bl .qi{color:var(--blue)}
@media (hover:hover){ .qc:hover{transform:translateY(-4px);box-shadow:0 26px 60px rgba(0,0,0,.25)} }

/* الدرع الحصين — بطاقة الإنجاز */
.feat{position:relative;border-radius:28px;overflow:hidden;isolation:isolate;min-height:360px;display:flex;align-items:flex-end;color:#fff;box-shadow:0 30px 80px rgba(6,13,32,.4);margin-bottom:12px;cursor:pointer}
.feat .ph{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center 30%;transition:transform 1s var(--ease)}
@media (hover:hover){ .feat:hover .ph{transform:scale(1.04)} }
@keyframes kb{to{transform:scale(1.14) translate(-2%,-2%)}}
.feat::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,13,32,.1) 0%,rgba(6,13,32,.35) 40%,rgba(6,13,32,.94) 100%)}
.feat::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:conic-gradient(from var(--ang,0deg),transparent 0 60%,var(--am) 75%,var(--or) 80%,transparent 95%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;--ang:200deg}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes rim{to{--ang:360deg}}
.feat .in{width:100%;padding:22px}
.feat .tags{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.feat .sh2{width:58px;height:66px;flex:none;filter:drop-shadow(0 8px 16px rgba(0,0,0,.4))}
.feat .sh2 img{width:100%;height:100%;object-fit:contain}
.feat .tg{font-size:13.5px;font-weight:700;color:rgba(255,255,255,.8)}
.feat .tg b{display:block;font-family:var(--disp);font-size:17px;color:#fff}
.feat h3{font-family:var(--cal);font-size:clamp(40px,11vw,64px);font-weight:700;display:flex;align-items:center;gap:12px}
.medal3{flex:none;width:56px;height:70px}
.feat .st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.feat .st div{border-radius:16px;padding:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-align:center}
.feat .st b{display:block;font-family:var(--disp);font-weight:800;font-size:22px;line-height:1.3}
.feat .st span{font-size:12.5px;color:rgba(255,255,255,.75);font-weight:600}
